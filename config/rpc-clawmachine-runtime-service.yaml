# RPC ClawMachine Runtime Service Configuration (gRPC)

service:
  name: "clawmachine-runtime-service"
  host: "0.0.0.0"
  port: 9092
  mode: "release"

grpc:
  host: "0.0.0.0"
  port: 9092
  reflection: true

discovery:
  enabled: true
  etcd:
    endpoints:
      - "localhost:2379"
    timeout: "5s"

# Claw machine specific configuration
claw_machine:
  default_target_rtp: 85.0

# Import shared configurations
shared:
  clawmachine_database: "shared.yaml"
  redis: "shared.yaml"
  logging: "shared.yaml"
  jwt: "shared.yaml"
  tracing: "shared.yaml"
