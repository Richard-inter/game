networks:
  game-network:
    driver: bridge
services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql.game
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootPassword
      MYSQL_DATABASE: game
      MYSQL_USER: gameuser
      MYSQL_PASSWORD: gamepass
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - game-network
  
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis.game
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - game-network

  # etcd for Service Discovery
  etcd:
    image: quay.io/coreos/etcd:v3.6.7
    container_name: etcd.game
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_NAME=etcd-server
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd.game:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd.game:2380
      - ETCD_INITIAL_CLUSTER=etcd-server=http://etcd.game:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
    volumes:
      - etcd_data:/etcd-data
    networks:
      - game-network

volumes:
  mysql_data:
  redis_data:
  etcd_data:
